name: live sources

# The tests use fake responses. This runs the real ingestion against CISA,
# FIRST, NVD, GitHub and OSV.dev, so a change in their formats shows up here
# within a week.
on:
  push:
    branches: [main]
    paths: ["src/**", "requirements.txt", "assets.toml"]
  schedule:
    - cron: "40 14 * * 3" # Wednesdays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt -e .

      - name: Ingest KEV and the latest EPSS day
        run: |
          vulnprio ingest kev
          vulnprio ingest epss

      # Both NVD paths, without the full ~225 MB rebuild: the smallest yearly
      # feed (checked against its .meta hash) and two days of API changes.
      - name: Ingest NVD (one feed + API)
        run: |
          vulnprio ingest nvd --years 2002
          vulnprio ingest nvd --since "$(date -u -d '2 days ago' +%F)"

      # GitHub raw files, pip resolution and OSV.dev, for every asset in assets.toml.
      - name: Scan the assets' dependencies
        run: vulnprio ingest deps

      # One day of each EPSS file format, oldest first.
      - name: Ingest historical EPSS formats
        run: |
          vulnprio ingest epss --date 2021-05-01
          vulnprio ingest epss --date 2021-10-01
          vulnprio ingest epss --date 2023-03-07

      - name: Status
        run: vulnprio status
