name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Only ruff, hash-pinned at the version in requirements-dev.txt.
      - name: Install ruff
        run: pip install --require-hashes -r requirements-lint.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Every package is pinned by hash: a file that changed on PyPI fails the install.
      # The project itself is installed afterwards, without dependencies.
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      # Fails when coverage of src/vulnprio drops below 90% (pyproject.toml).
      - name: Test
        run: |
          coverage run -m pytest -q
          coverage report

  audit:
    # Fails when a pinned dependency has a known vulnerability (PyPI advisory database / OSV).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install --require-hashes -r requirements-audit.txt

      - name: Audit dependencies
        run: |
          pip-audit --strict -r requirements.txt -r requirements-dev.txt -r requirements-issues.txt \
            -r requirements-lint.txt -r requirements-audit.txt -r requirements-release.txt
