name: release

# On a version tag (v1.2.3): build the package with a hash-pinned builder,
# attest its build provenance (SLSA, signed through Sigstore), and publish a
# GitHub release with the files, the provenance bundle and the changelog entry.
#
# Anyone can then check that a file came from this repository and this workflow:
#   gh attestation verify vulnprio-1.0.0-py3-none-any.whl --repo JoaoPedro0305/vuln-priority-pipeline
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance
      attestations: write # store the provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "tag $TAG but pyproject.toml says $version"; exit 1; }

      # build and setuptools from a hash-pinned lock; --no-isolation makes the
      # build use them instead of downloading the latest setuptools.
      - name: Build
        run: |
          pip install --require-hashes -r requirements-release.txt
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build --no-isolation
          ls -l dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version="${TAG#v}"
          # The changelog entry for this version: from its heading to the next one.
          awk -v v="## $version" '$0 ~ "^"v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md entry for $version"; exit 1; }
          cp "$BUNDLE" "vulnprio-$version.intoto.jsonl"
          gh release create "$TAG" dist/* "vulnprio-$version.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
