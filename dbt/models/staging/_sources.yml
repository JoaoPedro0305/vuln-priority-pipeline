version: 2

sources:
  - name: raw
    description: Tables loaded by `vulnprio ingest`, as published by each source (only typed).
    schema: raw
    config:
      loaded_at_field: loaded_at
      # A daily pipeline: data older than this means ingestion stopped running.
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: kev
        description: CISA Known Exploited Vulnerabilities catalog, replaced in full on each load.
        columns:
          - name: cve_id
            data_tests: [unique, not_null]
          - name: known_ransomware_use
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["Known", "Unknown"]

      - name: epss
        description: EPSS scores, one row per CVE per scored day.
        columns:
          - name: cve_id
            data_tests: [not_null]
          - name: epss
            data_tests:
              - values_between:
                  arguments: {min_value: 0, max_value: 1}

      - name: nvd
        description: NVD CVE records, one row per CVE (latest version), nested fields as JSON.
        columns:
          - name: cve_id
            data_tests: [unique, not_null]
          - name: vuln_status
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - Received
                      - Awaiting Analysis
                      - Undergoing Analysis
                      - Analyzed
                      - Modified
                      - Deferred
                      - Rejected

      # Dependency scans (vulnprio ingest deps) run when assets change, not
      # necessarily daily, so they have no freshness threshold.
      - name: assets
        description: Systems listed in assets.toml, replaced on each dependency scan.
        config:
          freshness: null
        columns:
          - name: asset
            data_tests: [unique, not_null]
          - name: publicly_exposed
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["yes", "no"]
          - name: mission_impact
            data_tests:
              - accepted_values:
                  arguments:
                    values: [low, medium, high]

      - name: asset_packages
        config:
          freshness: null
        data_tests:
          - unique_combination:
              arguments:
                columns: [asset, package]

      - name: asset_vulns
        config:
          freshness: null
        data_tests:
          - unique_combination:
              arguments:
                columns: [asset, package, vuln_key]

      - name: osv_vulns
        config:
          freshness: null
        columns:
          - name: osv_id
            data_tests: [unique, not_null]
