name: vulnprio
version: "0.1.0"
config-version: 2
profile: vulnprio

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, logs]

# Three layers, one schema each:
#   staging       one view per source table: renamed, typed, trimmed, nested JSON unpacked
#   intermediate  per-CVE building blocks (chosen CVSS score, latest EPSS, ...)
#   marts         the tables that the scoring, the backtest and the dashboard read
models:
  vulnprio:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  vulnprio:
    +schema: reference

# The two inputs of CISA's decision tables that describe the organisation, not
# the vulnerability. Override per run, e.g.
#   vulnprio transform --vars '{mission_impact: high, publicly_exposed: "no"}'
vars:
  # SSVC "Mission & Well-Being Impact" of the affected systems: low, medium or high.
  mission_impact: medium
  # BOD 26-04 "Publicly Exposed": reachable from the internet. "yes" assumes the worst.
  publicly_exposed: "yes"

flags:
  send_anonymous_usage_stats: false
